name: Publish schema explorer

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-schema-pages.yml"
      - "scripts/generate_schema_html.py"
      - "table_definitions/**"
      - "tables/**"
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate schema explorer
        run: python scripts/generate_schema_html.py --output schema_explorer.html

      - name: Verify output exists
        run: test -s schema_explorer.html

      - name: Prepare Pages artifact
        run: |
          mkdir -p site
          cp schema_explorer.html site/index.html
          cp -R png site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
